[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "neuroworm-snake"
version = "1.2.0"
description = "NeuroWorm Snake: C. elegans connectome simulation and genetic algorithm ablation harness"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "pygame>=2.5; python_version < '3.14'",
    "pygame-ce>=2.5; python_version >= '3.14'",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov", "black", "ruff", "pillow"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["connectome", "simulation", "game", "training", "viz", "evaluation"]
