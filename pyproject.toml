[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "neuroworm-snake"
version = "1.0.0"
description = "C. elegans connectome plays Snake — a bio-inspired AI game"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.12",
    "pygame>=2.5",
    "matplotlib>=3.8",
    "torch>=2.2",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov", "black", "ruff"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
